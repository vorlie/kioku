[package]
name = "kioku-for-anilist"
version = "0.1.0"
description = "A polished, modern desktop client for managing your AniList anime and manga libraries."
authors = ["vorlie"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kioku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tiny_http = "0.12"
rand = "0.8"
url = "2"
ani_lib = {
    git = "https://github.com/vorlie/ani-cli-rs.git",
    rev = "a430c6e6a203dcf9fac8817e132bffcbd4bac11f",
    package = "ani-cli-rs",
}
