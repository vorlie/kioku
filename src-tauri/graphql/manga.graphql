query ($id: Int) {
  Media(id: $id, type: MANGA) {
    id
    title {
      romaji
      english
      native
      userPreferred
    }
    coverImage {
      extraLarge
      large
      medium
      color
    }
    bannerImage
    description
    chapters
    volumes
    status
    genres
    averageScore
    meanScore
    format
    source
    countryOfOrigin
    isAdult
    isFavourite
    siteUrl
    relations {
      edges {
        relationType
        node {
          id
          type
          title {
            romaji
            english
            native
            userPreferred
          }
          coverImage {
            large
            medium
            color
          }
          status
          format
        }
      }
    }
    characters(sort: [ROLE, RELEVANCE], perPage: 12) {
      edges {
        role
        node {
          id
          name {
            full
          }
          image {
            large
            medium
          }
        }
      }
    }
    staff(sort: RELEVANCE, perPage: 8) {
      edges {
        role
        node {
          id
          name {
            full
          }
          image {
            large
            medium
          }
        }
      }
    }
    recommendations(sort: RATING_DESC, perPage: 6) {
      nodes {
        mediaRecommendation {
          id
          type
          title {
            romaji
            english
            userPreferred
          }
          coverImage {
            large
            medium
          }
          format
          averageScore
        }
      }
    }
  }
}
