query ($id: Int) {
  Media(id: $id, type: MANGA) {
    id
    title {
      romaji
      english
      native
      userPreferred
    }
    coverImage {
      extraLarge
      large
      medium
      color
    }
    bannerImage
    description
    chapters
    volumes
    status
    genres
    averageScore
    meanScore
    format
    source
    countryOfOrigin
    isAdult
    siteUrl
    relations {
      edges {
        relationType
        node {
          id
          type
          title {
            romaji
            english
            native
            userPreferred
          }
          coverImage {
            large
            medium
            color
          }
          status
          format
        }
      }
    }
  }
}
