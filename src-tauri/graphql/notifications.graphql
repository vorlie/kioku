query Notifications(
  $page: Int
  $perPage: Int
  $typeIn: [NotificationType]
  $resetNotificationCount: Boolean
) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      total
      perPage
      currentPage
      lastPage
      hasNextPage
    }
    notifications(
      type_in: $typeIn
      resetNotificationCount: $resetNotificationCount
    ) {
      ... on AiringNotification {
        id
        type
        animeId
        episode
        contexts
        createdAt
        media {
          id
          type
          title {
            userPreferred
            english
            romaji
            native
          }
          coverImage {
            medium
            large
            color
          }
          format
          siteUrl
        }
      }
      ... on FollowingNotification {
        id
        userId
        type
        context
        createdAt
        user {
          id
          name
          avatar {
            medium
            large
          }
          siteUrl
        }
      }
      ... on ActivityMessageNotification {
        id
        userId
        type
        activityId
        context
        createdAt
        user {
          id
          name
          avatar {
            medium
            large
          }
          siteUrl
        }
        message {
          id
          type
          message
          siteUrl
        }
      }
      ... on ActivityMentionNotification {
        id
        userId
        type
        activityId
        context
        createdAt
        user {
          id
          name
          avatar {
            medium
            large
          }
          siteUrl
        }
        activity {
          ... on TextActivity {
            id
            type
            text
            siteUrl
          }
          ... on ListActivity {
            id
            type
            status
            progress
            siteUrl
            media {
              id
              type
              title {
                userPreferred
                english
                romaji
                native
              }
              coverImage {
                medium
                large
                color
              }
              format
              siteUrl
            }
          }
          ... on MessageActivity {
            id
            type
            message
            siteUrl
          }
        }
      }
      ... on ActivityReplyNotification {
        id
        userId
        type
        activityId
        context
        createdAt
        user {
          id
          name
          avatar {
            medium
            large
          }
          siteUrl
        }
        activity {
          ... on TextActivity {
            id
            type
            text
            siteUrl
          }
          ... on ListActivity {
            id
            type
            status
            progress
            siteUrl
            media {
              id
              type
