      ... on CharacterSubmissionUpdateNotification {
        id
        type
        contexts
        status
        notes
        createdAt
        character {
          id
          name {
            full
            userPreferred
          }
          image {
            medium
            large
          }
          siteUrl
        }
      }
    }
  }
}
