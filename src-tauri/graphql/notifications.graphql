      ... on ActivityReplySubscribedNotification {
        id
        userId
        type
        activityId
        context
        createdAt
        user {
          id
          name
          avatar {
            medium
            large
          }
          siteUrl
        }
        activity {
          ... on TextActivity {
            id
            type
            text
            siteUrl
          }
          ... on ListActivity {
            id
            type
            status
            progress
            siteUrl
            media {
              id
              type
              title {
                userPreferred
                english
                romaji
                native
              }
              coverImage {
                medium
                large
                color
              }
              format
              siteUrl
            }
          }
          ... on MessageActivity {
            id
            type
            message
            siteUrl
          }
